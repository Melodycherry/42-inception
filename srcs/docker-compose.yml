# 3.8 est la norme stable pour docker
version: '3.8'

# Bloc services va lister tous les conteneurs 
services:

  # Data base MariaDB
  mariadb:
    # build va construire image localement a partir des fichiers sources (avec chemin du doss + dockerfile)
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    # Si le service plante ou si la machine redémarre, Docker relancera automatiquement le conteneur
    restart: always
    env_file:
      - ../.env
    # Associe le volume nommé db_data au dossier /var/lib/mysql à l'intérieur du conteneur (là où MariaDB stocke physiquement les tables SQL).
    volumes:
      - db_data:/var/lib/mysql
    # Va connecter le conteneur au reseau prive 
    networks:
      - inception_network

  # website WordPress
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    restart: always
    # etabli un ordre : Docker lancera le conteneur mariadb avant de démarrer wordpress
    depends_on:
      - mariadb
    env_file:
      - ../.env
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network

  # web server NGINX
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    # ordre ici aussi : NGINX attend que le conteneur wordpress soit démarré avant de se lancer
    depends_on:
      - wordpress
    # Le seul point d entree !!! (check diagram sujet)
    ports:
      - "443:443"
    # NGINX monte le même volume wp_data que WordPress
    # cela permet à NGINX de lire directement les fichiers statiques (.css, .js, images) dans /var/www/html sans repasser par PHP.
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network

# volumes en bindmount x 2
volumes:
  wp_data:
    name: wp_data
  db_data:
    name: db_data

# reseau virtuel de type bridge 
networks:
  inception_network:
    driver: bridge

