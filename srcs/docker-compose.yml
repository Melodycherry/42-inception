# RESEAU BRIDGE
# mode bridge va creer un switch virtuel au sein de docker. Tts les conteneurs branches sur ce reseau vont recevoir adresse IP privee
# Sur un réseau Bridge personnalisé, Docker intègre un serveur DNS interne
# donc chaque conteneur peut joindre un autre conteneur en utilisant le nom du service comme nom d'hôte
# ( defini ds le docker compose ) 
# NGINX communique avec WordPress via wordpress:9000 
# WordPress communique avec MariaDB via mariadb:3306

# seul NGINX est exposé sur le port 443 de l'ordi
# maria db et wordpress ne sont pas exposés sur l'ordi hote, donc pas accessibles depuis l'exterieur
# communiquent uniquement a l'interieur du reseau bridge inception-network

